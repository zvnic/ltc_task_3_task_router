name: ${COMPOSE_PROJECT_NAME:-beeline-routes}

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV:-production}
      APP_PASSWORD: ${APP_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PLANNING_TIMEOUT_SECONDS: ${PLANNING_TIMEOUT_SECONDS:-45}
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-10}
      TRAVEL_NORM_MODE: ${TRAVEL_NORM_MODE:-advisory}
      TRAVEL_NORM_MAX_FACTOR: ${TRAVEL_NORM_MAX_FACTOR:-2.0}
      VALHALLA_URL: ${VALHALLA_URL:-https://valhalla1.openstreetmap.de}
      VALHALLA_CLIENT_ID: ${VALHALLA_CLIENT_ID:-task-router-local-demo}
      VALHALLA_MIN_INTERVAL_SECONDS: ${VALHALLA_MIN_INTERVAL_SECONDS:-1.05}
      OSRM_FALLBACK_URL: ${OSRM_FALLBACK_URL:-https://routing.openstreetmap.de}
      OTP_URL: ${OTP_URL:-}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-20}
      ROUTING_ROUTE_TIMEOUT_SECONDS: ${ROUTING_ROUTE_TIMEOUT_SECONDS:-45}
      ROUTING_RETRY_ATTEMPTS: ${ROUTING_RETRY_ATTEMPTS:-2}
      ROUTING_RETRY_BACKOFF_SECONDS: ${ROUTING_RETRY_BACKOFF_SECONDS:-1}
      # Пустое значение выключает поиск адреса в форме новой заявки.
      GEOCODER_URL: ${GEOCODER_URL-https://nominatim.openstreetmap.org}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -q 'Task Router Диспетчерская'"]
      interval: 4s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  backend_tools:
    profiles: ["tools"]
    build:
      context: ./backend
      target: tools
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      APP_ENV: test
      APP_PASSWORD: ${APP_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-10}
      TRAVEL_NORM_MODE: ${TRAVEL_NORM_MODE:-advisory}
      TRAVEL_NORM_MAX_FACTOR: ${TRAVEL_NORM_MAX_FACTOR:-2.0}
      VALHALLA_URL: ${VALHALLA_URL:-https://valhalla1.openstreetmap.de}
      VALHALLA_CLIENT_ID: ${VALHALLA_CLIENT_ID:-task-router-local-demo}
      VALHALLA_MIN_INTERVAL_SECONDS: ${VALHALLA_MIN_INTERVAL_SECONDS:-1.05}
      OSRM_FALLBACK_URL: ${OSRM_FALLBACK_URL:-https://routing.openstreetmap.de}
      OTP_URL: ${OTP_URL:-}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-20}
      ROUTING_ROUTE_TIMEOUT_SECONDS: ${ROUTING_ROUTE_TIMEOUT_SECONDS:-45}
      ROUTING_RETRY_ATTEMPTS: ${ROUTING_RETRY_ATTEMPTS:-2}
      ROUTING_RETRY_BACKOFF_SECONDS: ${ROUTING_RETRY_BACKOFF_SECONDS:-1}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend_tools:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: tools
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  e2e:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: e2e
    environment:
      BASE_URL: http://web:8080
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
