# Управляется scripts/setup-nginx-ssl.sh (hackathon_beeline_routes).
# Публикует веб-приложение «Task Router Диспетчерская».
# TLS и HTTP->HTTPS редирект добавляются certbot'ом (строки "# managed by Certbot").
server {
    listen 80;
    listen [::]:80;
    server_name task-router.ii2b.ru;

    client_max_body_size 25M;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:{{WEB_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }
}
